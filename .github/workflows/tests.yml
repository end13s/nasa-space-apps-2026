name: Engine tests

# The engine and its browser port must never drift apart silently.
# This runs on every push and pull request and takes under a minute.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas pyarrow scipy pyyaml
      - name: Unit tests
        run: python engine/tests/test_score.py
      - name: Python / JavaScript parity
        run: python engine/tests/test_parity.py
